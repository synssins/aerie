name: CI

# Runs every test on each pull request and on main. Branch protection on main should require the jobs "server" and "client".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    # Windows: two storage tests (network-share credentials) only pass on Windows, where IIS installs run.
    # The integration tests are split into shards that run at once (tools/test-shard.ps1); shard 0 also runs the unit tests.
    name: server (shard ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      SHARDS: "8"
      # The build takes the package versions the lock files name, and fails when a lock file is out of date.
      RestoreLockedMode: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Build
        run: dotnet build Kb.sln
      # Fails the build when a package, direct or pulled in by another, has a known vulnerability.
      - name: Vulnerable packages
        if: matrix.shard == 0
        shell: pwsh
        run: |
          $report = dotnet list Kb.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $report
          if ($LASTEXITCODE -ne 0 -or $report -match 'has the following vulnerable packages') { exit 1 }
      - name: Unit tests
        if: matrix.shard == 0
        run: dotnet test --project tests/Kb.Tests.Unit --no-build
      - name: Integration tests
        shell: pwsh
        run: tools/test-shard.ps1 -Shard ${{ matrix.shard }} -Of $env:SHARDS

  # One check that stands for every shard, so branch protection names one job and the shard count can change.
  server:
    if: always()
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.server-tests.result }}" = "success"

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-fund --no-audit
      # What is shipped to browsers has no known vulnerability of high or critical severity, or the build fails.
      # The build and test tooling (vite, vitest) is not counted here: see README, "Dependency checks".
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
